name: Update README with AI Insight

# Gatilhos: Roda todo dia à 1h da manhã UTC e também permite execução manual
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: |
          python -c "
import os
import requests
import re

API_URL = os.getenv('API_URL')
README_FILE = 'README.md'
prompt_text = 'Qual é uma reflexão interessante sobre a intersecção entre tecnologia e finanças?'

print(f'Calling API at {API_URL}...')
response = requests.post(API_URL, json={'prompt': prompt_text})
response.raise_for_status()

ai_response_text = response.json().get('response', '').replace(prompt_text, '').strip()

if not ai_response_text:
    print('No valid response from AI.')
    exit()

print(f'AI Response: {ai_response_text}')

with open(README_FILE, 'r', encoding='utf-8') as f:
    readme_content = f.read()

new_readme_content = re.sub(
    r'()(.*)()',
    f'\\1\n> {ai_response_text}\n\\3',
    readme_content,
    flags=re.DOTALL
)

with open(README_FILE, 'w', encoding='utf-8') as f:
    f.write(new_readme_content)

print('README.md updated successfully.')
"
        env:
          # URL da sua API de MLOps em produção no Render
          API_URL: https://mlops-l86d.onrender.com/generate

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          # Só faz o commit se houver alterações
          git diff --staged --quiet || git commit -m 'docs: Update README with new AI insight'
          git push
