name: Python Application CI
# Triggers: This pipeline runs on pushes and pull requests to the 'Main' branch.
on:
  push:
    branches: [ Main ]
  pull_request:
    branches: [ Main ]

jobs:
  build-and-test:
    # The virtual machinne where's the job will be executed
    runs-on: ubuntu-latest

    steps:
    # Step 1: runs the code repository checkout
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Configure the Python Enviroment
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: 3.8

    # Step 3: Install the project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run testes with pytest
    # The build will  fail automatically if any test fail O
    - name: Run tests with pytest
      run: |
        export PYTHONPATH=.
        pytest tests/

